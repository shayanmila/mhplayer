name: MH Player Windows - Installer + Portable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows player dependencies
        run: dotnet restore desktop/MHPlayer.Windows.csproj -r win-x64
      - name: Publish self-contained Windows application
        run: dotnet publish desktop/MHPlayer.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish -p:PublishSingleFile=false
      - name: Check published executable
        shell: pwsh
        run: |
          if (!(Test-Path publish/MHPlayer.exe)) { throw "Windows executable missing" }
          if (!(Get-ChildItem publish -Recurse -Filter libvlc.dll)) { throw "VLC native runtime missing" }
      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/MH-Player-Windows-x64-Portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build graphical Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "desktop\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Verify both packages
        shell: pwsh
        run: |
          foreach ($f in @("dist/MH-Player-Windows-x64-Setup.exe", "dist/MH-Player-Windows-x64-Portable.zip")) {
            if (!(Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "Missing package: $f" }
            Get-FileHash $f -Algorithm SHA256
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Player-Windows-Installer-and-Portable
          path: dist/*
          retention-days: 30
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-desktop-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create $tag dist/MH-Player-Windows-x64-Setup.exe dist/MH-Player-Windows-x64-Portable.zip --title "MH Player Windows Desktop - $tag" --notes "First Windows desktop edition (local media player). Installer and portable ZIP. Test before publishing." --draft --target "${{ github.sha }}"
