name: MH Player - Main APK + Clone APK + AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique Play Console versionCode (must exceed previous uploads)'
        required: true
        type: number
      publish_draft_release:
        description: 'Create a draft GitHub Release containing all three files'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify signing secrets and prepare keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing signing secret: $name"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mh-release.jks"
          echo "MH_KEYSTORE_PATH=$RUNNER_TEMP/mh-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Main APK and signed Play Console AAB
        env:
          MH_VERSION_CODE: ${{ inputs.version_code }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Preserve original outputs
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MH-Player-Main.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/MH-Player-Play-Console.aab
      - name: Build separate installable Clone APK
        env:
          MH_CLONE_BUILD: 'true'
          MH_VERSION_CODE: ${{ inputs.version_code }}
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace --rerun-tasks
      - name: Verify and package three files
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk dist/MH-Player-Clone.apk
          for file in dist/MH-Player-Main.apk dist/MH-Player-Clone.apk dist/MH-Player-Play-Console.aab; do
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
            sha256sum "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Player-Android-Three-Files
          path: dist/*
          retention-days: 30
      - name: Create draft release
        if: ${{ inputs.publish_draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-three-files-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/MH-Player-Main.apk dist/MH-Player-Clone.apk dist/MH-Player-Play-Console.aab \
            --title "MH Player Android (versionCode ${{ inputs.version_code }})" \
            --notes "Main signed APK: com.masoomdev.mhplayer. Clone signed APK: com.masoomdev.mhplayer.clone. Signed AAB: Play Console original package. Review before publishing; AAB should not be made public unnecessarily." \
            --draft --target "$GITHUB_SHA"
