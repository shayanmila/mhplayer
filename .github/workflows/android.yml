name: Build MH Player APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK with unique Play version code
        env:
          MH_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "MH Player APK - $TAG" --notes "Automated debug APK build. Not a signed Play Store release." --prerelease --target "$GITHUB_SHA"
  # Signed Play Console bundle, triggered by [build-aab] commit or manual dispatch. AndroidX SDK and edge-to-edge maintenance release.
  release-aab:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-aab]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing MH Player signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mh-release.jks"
          echo "MH_KEYSTORE_PATH=$RUNNER_TEMP/mh-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        env:
          MH_KEYSTORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
          MH_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:bundleRelease --no-daemon
      - name: Publish signed AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="aab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f app/build/outputs/bundle/release/app-release.aab
          gh release create "$TAG" app/build/outputs/bundle/release/app-release.aab --title "MH Player signed AAB - $TAG" --notes "Signed release AAB for Play Console. Keep this private." --prerelease --target "$GITHUB_SHA"
